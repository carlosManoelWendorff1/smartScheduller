spring.application.name=smartScheduller

# NUNCA usar 'create'/'create-drop' em ambientes reais.
# O schema e 100% controlado por Flyway migrations (ver secao 21 das instrucoes mestre).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.com.smartScheduller=DEBUG
logging.level.org.springframework.modulith=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n