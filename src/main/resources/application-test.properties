# O datasource NAO e fixado aqui: os testes usam @ServiceConnection (Spring Boot 3.1+)
# associado a um container Postgres efemero (Testcontainers), e o Spring injeta
# url/usuario/senha automaticamente em tempo de execucao.

spring.jpa.show-sql=false
spring.flyway.enabled=true

logging.level.com.smartscheduller=DEBUG
logging.level.org.testcontainers=INFO